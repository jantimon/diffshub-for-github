# Sends a released version to the Chrome Web Store and addons.mozilla.org. The
# release workflow calls it after each release. Run it by hand from the Actions
# tab to retry one store, or with dry-run to check the credentials. A store that
# already has the version is skipped, so running it again is safe
name: stores

on:
  workflow_call:
    inputs:
      version:
        type: string
        required: true
      store:
        type: string
        default: both
      dry-run:
        type: boolean
        default: false
  workflow_dispatch:
    inputs:
      version:
        description: 'Version already released on GitHub, such as 1.2.3'
        type: string
        required: true
      store:
        type: choice
        options: [both, chrome, firefox]
        default: both
      dry-run:
        description: 'Check the credentials only, upload nothing'
        type: boolean
        default: false

permissions:
  contents: read

jobs:
  chrome:
    if: inputs.store != 'firefox'
    runs-on: ubuntu-latest
    environment: stores
    env:
      VERSION: ${{ inputs.version }}
      DRY_RUN: ${{ inputs.dry-run && '--dry-run' || '' }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: v${{ inputs.version }}
          persist-credentials: false
      - uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22.18
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: fetch the zips from the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release download "v$VERSION" --pattern '*.zip' --dir release
      - name: send to the Chrome Web Store
        env:
          CHROME_PUBLISHER_ID: ${{ vars.CHROME_PUBLISHER_ID }}
          CHROME_EXTENSION_ID: ${{ vars.CHROME_EXTENSION_ID }}
          CHROME_SERVICE_ACCOUNT_CLIENT_EMAIL: ${{ secrets.CHROME_SERVICE_ACCOUNT_CLIENT_EMAIL }}
          CHROME_SERVICE_ACCOUNT_PRIVATE_KEY: ${{ secrets.CHROME_SERVICE_ACCOUNT_PRIVATE_KEY }}
          CHROME_UPLOAD_SIGNING_KEY: ${{ secrets.CHROME_UPLOAD_SIGNING_KEY }}
        run: node scripts/release/submit.mjs chrome "$VERSION" release $DRY_RUN

  firefox:
    if: inputs.store != 'chrome'
    runs-on: ubuntu-latest
    environment: stores
    env:
      VERSION: ${{ inputs.version }}
      DRY_RUN: ${{ inputs.dry-run && '--dry-run' || '' }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: v${{ inputs.version }}
          persist-credentials: false
      - uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22.18
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: fetch the zips from the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release download "v$VERSION" --pattern '*.zip' --dir release
      - name: write the release notes
        run: node scripts/release/notes.mjs "$VERSION" release
      - name: send to addons.mozilla.org
        env:
          FIREFOX_EXTENSION_ID: diffshub-for-github@jantimon.dev
          FIREFOX_JWT_ISSUER: ${{ secrets.FIREFOX_JWT_ISSUER }}
          FIREFOX_JWT_SECRET: ${{ secrets.FIREFOX_JWT_SECRET }}
        run: node scripts/release/submit.mjs firefox "$VERSION" release $DRY_RUN
